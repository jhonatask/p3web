server:
  port: ${PORT:8080}

spring:
  application:
    name: p3
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/p3db}
    username: ${SPRING_DATASOURCE_USERNAME:chamada}
    password: ${SPRING_DATASOURCE_PASSWORD:chamada}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
  chamada:
    base-url: ${CHAMADA_BASE_URL:http://localhost:3000/chamada}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
