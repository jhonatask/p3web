services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=p3db'
      - 'POSTGRES_USER=chamada'
      - 'POSTGRES_PASSWORD=chamada'
    ports:
      - '5432:5432'
    volumes:
      - 'p3db_postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chamada -d p3db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  p3db_postgres_data:
