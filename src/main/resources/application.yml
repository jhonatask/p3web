server:
  port: ${PORT:8080}

spring:
  application:
    name: p3
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/p3db}
    username: ${SPRING_DATASOURCE_USERNAME:chamada}
    password: ${SPRING_DATASOURCE_PASSWORD:chamada}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWK_SET_URI}
          jws-algorithms: ES256

app:
  chamada:
    base-url: ${CHAMADA_BASE_URL:http://localhost:3000/chamada}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    remetente: ${APP_EMAIL_REMETENTE:nao-responda@familychurch.com.br}
  atualizacao-cadastro:
    base-url: ${APP_ATUALIZACAO_CADASTRO_URL:http://localhost:3000/cadastro-base/atualizar}
