spring:
  application:
    name: p3
  datasource:
    url: jdbc:postgresql://localhost:5432/chamada
    username: chamada
    password: chamada
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:chave-secreta-de-desenvolvimento-nao-usar-em-producao-1234567890}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:60}
  cadastro:
    base-url: ${CADASTRO_BASE_URL:https://app.com/cadastro}
